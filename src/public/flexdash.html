<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="./flexdash/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlexDash</title>
    <link rel="stylesheet" href="./flexdash/assets/index.02099a86.css">
    <style>
      /* Fix Vuetify 3.0.x: active overlays stuck at opacity:0 due to broken keyframe animations */
      .v-overlay--active>.v-overlay__content{opacity:1!important;pointer-events:auto!important}
      /* Fix Vuetify 2→3: .container utility class removed in V3, used by std-grid.vue */
      .container{width:100%;padding:12px;margin-right:auto;margin-left:auto}
    </style>
    <script>
      /* Fix Vuetify 3.0.x: VTextField type="number" emits InputEvent instead of value string */
      ;(function(){var s;Object.defineProperty(window,'fd_store',{configurable:true,
        set:function(v){s=v;if(v&&typeof v.updateWidgetProp==='function'){var o=v.updateWidgetProp.bind(v);
          v.updateWidgetProp=function(id,w,p,val){if(val instanceof Event)val=val.target?val.target.value:'';return o(id,w,p,val)}}},
        get:function(){return s}})})()
    </script>
  </head>
  <body>
    <div id="app">FlexDash loading...</div>
    <script>
      flexdash_options = {
        title: 'SG',
        sio: window.location.origin + '/fd',
        username: 'gnome'
      }
    </script>
    <script type="module" src="./flexdash/assets/index.f7268a74.js"></script>
    <noscript>
      <strong>Sorry, but FlexDash requires JavaScript to be enabled.</strong>
    </noscript>
  </body>
</html>
